repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan — staged changes)
        description: >
          Blochează commit-ul dacă modificările staged conțin un secret (cheie API,
          token, credențial). Necesită gitleaks instalat local (brew install gitleaks) —
          vezi README.md.
        entry: gitleaks protect --staged --verbose --redact
        language: system
        pass_filenames: false
