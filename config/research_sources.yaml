# Registry de surse pentru serviciul de research.
#
# Prezența aici NU activează ingestia. Doar sursele cu tos_reviewed_at setat și
# review_status în {reviewed, reviewed_with_dynamic_limit} sunt fetchable.
# ECB / Eurostat / RSS-urile oficiale stau ca pending până la ToS complet.
# Kraken nu e aici — e market data, nu research.

sources:
  - source_id: fred
    name: "FRED - Federal Reserve Economic Data"
    kind: api
    base_url: "https://api.stlouisfed.org/fred"
    docs_url: "https://fred.stlouisfed.org/docs/api/fred/"
    terms_url: "https://fred.stlouisfed.org/docs/api/terms_of_use.html"
    robots_txt_status: not_applicable_api
    credibility_score: 0.95
    tos_reviewed_at: "2026-09-19"
    last_verified_at: "2026-09-19"
    rate_limit_per_min: 120
    rate_limit_source: "https://fred.stlouisfed.org/docs/api/fred/errors.html"
    review_status: reviewed
    attribution_required: true
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Necesită API key."
      - "Include attribution FRED."
      - "Verifică restricțiile pentru seriile de date provenite de la terți."
      - "Afișează disclaimer-ul cerut de termenii FRED."

  - source_id: alfred
    name: "ALFRED - Archival Federal Reserve Economic Data"
    kind: api
    base_url: "https://api.stlouisfed.org/fred"
    docs_url: "https://fred.stlouisfed.org/docs/api/fred/"
    terms_url: "https://fred.stlouisfed.org/docs/api/terms_of_use.html"
    robots_txt_status: not_applicable_api
    credibility_score: 0.95
    tos_reviewed_at: "2026-09-19"
    last_verified_at: "2026-09-19"
    rate_limit_per_min: 120
    rate_limit_source: "https://fred.stlouisfed.org/docs/api/fred/errors.html"
    review_status: reviewed
    attribution_required: true
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Recomandat pentru backtesting."
      - "Folosește realtime_start/realtime_end = as_of (anti look-ahead)."
      - "Același API FRED; nu e un al doilea live feed."

  - source_id: sec_edgar
    name: "SEC EDGAR Data APIs"
    kind: api
    base_url: "https://data.sec.gov"
    docs_url: "https://www.sec.gov/edgar/sec-api-documentation"
    robots_url: "https://www.sec.gov/robots.txt"
    robots_txt_status: not_applicable_api
    credibility_score: 0.98
    tos_reviewed_at: "2026-09-19"
    last_verified_at: "2026-09-19"
    rate_limit_per_min: null
    min_request_interval_s: 0.1
    rate_limit_source: "https://www.sec.gov/developer"
    rate_limit_notes: "Prag aproximativ 10 request-uri/secundă; nu e o limită garantată pe minut."
    review_status: reviewed_with_dynamic_limit
    attribution_required: false
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Folosește submissions și companyfacts pe allowlist equity. companyconcept/frames rămân post-MVP."
      - "Trimite un User-Agent descriptiv și un email de contact."
      - "Nu folosi endpoint-ul CGI pentru integrarea principală."
      - "Respectă robots.txt pentru scraping-ul paginilor HTML."

  - source_id: bls
    name: "U.S. Bureau of Labor Statistics Public Data API"
    kind: api
    base_url: "https://api.bls.gov/publicAPI/v2"
    docs_url: "https://www.bls.gov/developers/api_FAQs.htm"
    robots_txt_status: not_applicable_api
    credibility_score: 0.97
    tos_reviewed_at: "2026-09-19"
    last_verified_at: "2026-09-19"
    rate_limit_per_min: null
    min_request_interval_s: 0.2
    rate_limit_notes: "Limita oficială este 50 request-uri/10 secunde. Nu trata 300/min ca limită documentată. Registered: până la 500 query-uri/zi."
    review_status: reviewed
    attribution_required: false
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Potrivit pentru CPI, employment și wage data."
      - "Valoarea 300/min este doar conversia teoretică; respectă 50/10 secunde."

  - source_id: bea
    name: "U.S. Bureau of Economic Analysis API"
    kind: api
    base_url: "https://apps.bea.gov/api/data"
    docs_url: "https://apps.bea.gov/api/_pdf/bea_web_service_api_user_guide.pdf"
    robots_txt_status: not_applicable_api
    credibility_score: 0.97
    tos_reviewed_at: "2026-09-19"
    last_verified_at: "2026-09-19"
    rate_limit_per_min: 100
    rate_limit_notes: "100 request-uri/minut. Folosește Retry-After la 429."
    review_status: reviewed
    attribution_required: false
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Util pentru GDP, personal income și corporate profits."

  - source_id: ecb_data
    name: "ECB Data Portal"
    kind: api
    base_url: "https://data-api.ecb.europa.eu/service"
    docs_url: "https://data.ecb.europa.eu/help/api/data"
    robots_txt_status: not_applicable_api
    credibility_score: 0.98
    tos_reviewed_at: null
    rate_limit_per_min: null
    review_status: docs_reviewed_terms_pending
    attribution_required: false
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Foarte util pentru cursuri valutare, dobânzi, inflație și indicatori europeni."
      - "Oferă SDMX și istoricul reviziilor prin includeHistory."
      - "Nu am găsit o limită numerică publică; throttling conservator după ToS."

  - source_id: eurostat
    name: "Eurostat Statistics API"
    kind: api
    base_url: "https://ec.europa.eu/eurostat/api/dissemination"
    docs_url: "https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/"
    robots_txt_status: not_applicable_api
    credibility_score: 0.97
    tos_reviewed_at: null
    rate_limit_per_min: null
    review_status: docs_reviewed_terms_pending
    attribution_required: false
    redistribution_allowed: unknown
    retention_policy: metadata_and_summary_only
    notes:
      - "Util pentru PIB, inflație, șomaj, comerț și indicatori UE."
      - "Fair use fără o limită fixă simplă de request-uri/minut."
      - "Păstrează local snapshot-urile; istoricul versiunilor nu e complet."

