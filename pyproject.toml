[project]
name = "trading-agent"
version = "0.1.0"
description = "Agent local de analiza si trading (multi-asset) — motor determinist + strat LLM izolat"
requires-python = "==3.12.*"
readme = "README.md"

# Versiuni fixate exact (==), nu ranges — Task 0, DoD "Toate dependentele fixate".
dependencies = [
    "nautilus_trader==1.231.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "trafilatura>=2.2.0",
    "websockets==15.0.1",
    "alembic==1.16.5",
    "psycopg[binary,pool]==3.2.10",
    "psycopg-pool==3.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "llm_live: calls local Ollama Qwen3-8B; skipped automatically if Ollama is not reachable",
    "network_live: calls a public network API; skipped automatically if the endpoint is not reachable",
    "postgres: requires TEST_DATABASE_URL and a migrated PostgreSQL database",
]

[tool.uv]
package = false
