# Drop-in for the vendor-installed ollama.service (from https://ollama.com/install.sh).
# Do not replace the vendor unit — override it, so `ollama` stays managed by its own
# installer/updater. Install with:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/systemd/ollama.service.d/override.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Invariant (docs/SERVER_DEPLOYMENT_AUDIT.md "Ollama must not be public"): Ollama must
# never be reachable outside loopback. Confirm after install with:
#   curl http://127.0.0.1:11434/api/tags   # must work
#   curl http://<tailscale-ip>:11434/api/tags   # must fail / connection refused
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
