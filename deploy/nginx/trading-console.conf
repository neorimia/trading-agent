# Serves the built Angular console and reverse-proxies the control API + WebSocket
# to the loopback control process. This is the production replacement for `ng serve`
# (docs/SERVER_DEPLOYMENT_AUDIT.md "Should have soon after" item #8).
#
# Loopback-only invariant: this nginx instance itself must only be reachable over the
# Tailscale interface, never a public IP. Bind it to the tailnet address, or bind to
# 127.0.0.1 and let Tailscale serve/funnel handle the tailnet-facing side — do not
# `listen 0.0.0.0:80` on a box with a public IP.
#
# `apps/console/src/app/core/agent-state.service.ts:eventsSocketUrl()` already falls
# back to `location.host` for the WS URL when not served from :4200, and
# `api.service.ts` does the same for the REST base URL — this config makes that
# assumption true by proxying /v1/* on the SAME host:port as the page.
#
# Install:
#   cd apps/console && npm ci && npm run build   # → dist/console/browser/
#   sudo cp deploy/nginx/trading-console.conf /etc/nginx/sites-available/trading-console
#   sudo ln -s /etc/nginx/sites-available/trading-console /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remember to also set CONTROL_CORS_ORIGINS in .env.control to include whatever
# origin the browser will actually send (e.g. https://<tailscale-hostname>) — the
# control server's WS handler checks Origin even for same-host proxied requests
# (src/control/server.py: ws_events).

server {
    listen 127.0.0.1:8080;   # bind to the tailnet IP instead if not using `tailscale serve`
    server_name _;

    root /opt/trading-agent/apps/console/dist/console/browser;
    index index.html;

    # Angular routing: serve index.html for unknown paths, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → control plane on loopback :8767.
    location /v1/ {
        proxy_pass http://127.0.0.1:8767/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade for /v1/ws/events — must carry Upgrade/Connection headers,
    # the plain /v1/ block above does not do this.
    location /v1/ws/ {
        proxy_pass http://127.0.0.1:8767/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # long-lived health/approvals stream
    }
}
